buildscript {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		gradlePluginPortal()
		mavenCentral()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:1.17.19"
	}
}

def mcVersion = providers.gradleProperty("mcVersion").getOrElse("1.21.1")
def versionProps = new Properties()
def versionFile = file("gradle/versions/${mcVersion}.properties")
if (!versionFile.exists()) {
	throw new GradleException("No version config found for ${mcVersion}: ${versionFile}")
}
versionFile.withInputStream { versionProps.load(it) }

def major = Integer.parseInt(mcVersion.split("\\.")[0])
def isUnobfuscated = major >= 26

if (isUnobfuscated) {
	apply plugin: "net.fabricmc.fabric-loom"
} else {
	apply plugin: "fabric-loom"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "jonarchymod-${mcVersion}"
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${versionProps.minecraft_version}"
	if (isUnobfuscated) {
		compileOnly "net.fabricmc:fabric-loader:${versionProps.loader_version}"
	} else {
		mappings "net.fabricmc:yarn:${versionProps.yarn_mappings}:v2"
		modImplementation "net.fabricmc:fabric-loader:${versionProps.loader_version}"
	}
	compileOnly "org.slf4j:slf4j-api:1.7.36"
}

sourceSets {
	main {
		java.srcDir("src/mixin/${mcVersion}/java")
		resources.srcDir("src/mixin/${mcVersion}/resources")
	}
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", versionProps.minecraft_version
	inputs.property "loader_version", versionProps.loader_version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
				"minecraft_version": inputs.properties.minecraft_version,
				"loader_version": inputs.properties.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(versionProps.java_release)
}

java {
	withSourcesJar()

	def javaVersion = JavaVersion.toVersion(Integer.parseInt(versionProps.java_release))
	sourceCompatibility = javaVersion
	targetCompatibility = javaVersion
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}